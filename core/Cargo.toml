[package]
name = "fude-core"
version = "0.1.0"
description = "FUDE lesson core: lesson format, library, validation, .fude packages, authoring, guides, hints and task assessment"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fude_core"

[[bin]]
name = "fude"
path = "src/bin/fude.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
