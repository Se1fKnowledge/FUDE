# Builds the Windows installers of FUDE with PhotoCraft inside: the editor lands next to
# fude.exe, where the app looks for it first. Runs on main and the SelfKnowledge development
# branch (a newer push cancels an older build), on version tags (which also make a GitHub
# release) and by hand from the Actions tab once this file is on main.
name: Build

on:
  push:
    branches: [main, SelfKnowledge]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            photocraft -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build PhotoCraft
        working-directory: photocraft
        run: cargo build --release --locked -p photocraft

      - name: Install front-end packages
        working-directory: app
        run: npm ci

      # tauri.bundle.conf.json adds photocraft.exe to the bundle; plain `tauri dev` stays as is.
      - name: Build FUDE installers
        working-directory: app
        run: npm run tauri build -- --config src-tauri/tauri.bundle.conf.json

      # A portable folder for machines where installing is not allowed: the same three pieces
      # the installer puts down (WebView2 ships with Windows 10 and 11).
      - name: Pack the portable version
        shell: pwsh
        run: |
          $dir = "target/portable/FUDE"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/fude.exe $dir
          Copy-Item photocraft/target/release/photocraft.exe $dir
          Copy-Item -Recurse lessons "$dir/lessons"
          Compress-Archive -Path $dir -DestinationPath target/portable/FUDE-portable-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FUDE-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/portable/FUDE-portable-windows-x64.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FUDE-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
