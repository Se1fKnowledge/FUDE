# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Собственная тень и полутон" = "Core shadow and halftone"
"Плавный переход от света к тени: полутон, терминатор и самое тёмное место формы." = "A smooth transition from light to shadow: the halftone, the terminator and the darkest spot of the form."
"Шар залит средним тоном. Мягкой кистью проложите собственную тень и полутон, не трогая освещённую сторону." = "The ball is filled with a mid tone. With a soft brush, lay in the core shadow and the halftone without touching the lit side."
"Настройте мягкую кисть: жёсткость не больше 30%, непрозрачность не больше 60%." = "Set up a soft brush: hardness no more than 30%, opacity no more than 60%."
"Мягкая кисть с низкой непрозрачностью позволяет наращивать тень постепенно." = "A soft brush with low opacity lets you build up the shadow gradually."
"Затемните собственную тень справа снизу, сразу за границей света." = "Darken the core shadow at the bottom right, right past the border of the light."
"Терминатор на шаре — дуга. Ведите кисть вдоль неё несколькими слоями." = "The terminator on a ball is an arc. Move the brush along it in several layers."
"Собственная тень пока слишком светлая." = "The core shadow is still too light."
"Проложите полутон: переход от света к тени через середину шара." = "Lay in the halftone: the transition from light to shadow through the middle of the ball."
"Ещё мягче и прозрачнее: непрозрачность 15–20%, широкая кисть." = "Even softer and more transparent: opacity 15–20%, a wide brush."
"Между светом и серединой шара нет перехода." = "There is no transition between the light and the middle of the ball."
"Полутон должен быть светлее собственной тени." = "The halftone must be lighter than the core shadow."
"Освещённая сторона потемнела — верните ей свет." = "The lit side has darkened — bring its light back."
"Где на шаре самая тёмная часть собственной тени?" = "Where is the darkest part of the core shadow on a ball?"
"У самого края шара" = "At the very edge of the ball"
"Сразу за терминатором" = "Right past the terminator"
"В центре" = "In the centre"
"У края шара тень высветляет отражённый свет — рефлекс. Ему посвящён урок 4." = "Near the edge of the ball the shadow is lightened by reflected light. Lesson 4 is about it."
"Полутон — это" = "The halftone is"
"Тень на полу" = "The shadow on the floor"
"Переход между светом и тенью на освещённой стороне" = "The transition between light and shadow on the lit side"
"Белый блик" = "A white highlight"
"Новый слой «Тени»" = "A new «Shadows» layer"
"Мягкая кисть: жёсткость 0%, непрозрачность 30%" = "A soft brush: hardness 0%, opacity 30%"
"Граница света и тени — линия терминатора — проходит через шар дугой" = "The border of light and shadow — the terminator line — crosses the ball in an arc"
"Слой за слоем темнее: собственная тень" = "Darker layer by layer: the core shadow"
"Полутон — мягкий переход между светом и тенью" = "The halftone is a soft transition between light and shadow"
