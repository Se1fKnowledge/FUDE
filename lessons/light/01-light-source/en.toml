# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Источник света и форма" = "Light source and form"
"Откуда свет — оттуда и форма. Делим шар на освещённую и теневую стороны." = "Where the light comes from shapes the form. Splitting a ball into a lit side and a shadow side."
"Солнце слева сверху. Залейте шар средним тоном и высветлите сторону, обращённую к свету." = "The sun is at the top left. Fill the ball with a mid tone and lighten the side facing the light."
"Создайте новый слой поверх линий." = "Create a new layer above the lines."
"Ctrl+Shift+N. Назовите слой «Тон»." = "Ctrl+Shift+N. Name the layer “Tone”."
"Залейте шар ровным средним серым тоном." = "Fill the ball with an even mid-grey tone."
"Овальной областью с Shift выделите шар по контуру, затем Shift+F5 и средний серый." = "Select the ball along its outline with the elliptical marquee and Shift, then Shift+F5 and a mid grey."
"Шар закрашен не целиком." = "The ball is not filled completely."
"Мягкой светлой кистью высветлите левую верхнюю часть шара — сторону к солнцу." = "With a soft light brush, lighten the top left part of the ball — the side towards the sun."
"Жёсткость 0%, непрозрачность 30–50%, светлый тон. Несколько мазков дугой у левого верхнего края." = "Hardness 0%, opacity 30–50%, a light tone. A few arcing strokes near the top left edge."
"Освещённая сторона пока не светлее теневой. Высветлите левую верхнюю часть шара." = "The lit side is not lighter than the shadow side yet. Lighten the top left part of the ball."
"Свет падает слева сверху. Какая часть шара светлее всего?" = "The light falls from the top left. Which part of the ball is the lightest?"
"Правая нижняя" = "The bottom right"
"Левая верхняя" = "The top left"
"Середина" = "The middle"
"Что такое терминатор?" = "What is the terminator?"
"Граница освещённой и теневой стороны" = "The border between the lit side and the shadow side"
"Самое светлое место" = "The lightest spot"
"Тень на полу" = "The shadow on the floor"
"Свет падает слева сверху — там, где солнце" = "The light falls from the top left — where the sun is"
"Новый слой «Тон» поверх линий" = "A new “Tone” layer above the lines"
"Овальной областью выделяем шар" = "Selecting the ball with the elliptical marquee"
"Заливаем ровным средним тоном" = "Filling with an even mid tone"
"Мягкой светлой кистью высветляем сторону к источнику" = "Lightening the side towards the source with a soft light brush"
"Выделение больше не нужно: Ctrl+D" = "The selection is no longer needed: Ctrl+D"
