# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Контровой свет и атмосфера" = "Backlight and atmosphere"
"Источник за предметом: тёмный силуэт, светящийся контур и ореол в воздухе." = "The source behind the object: a dark silhouette, a glowing outline and a halo in the air."
"Ночь, за шаром спрятан тёплый источник. Нарисуйте ореол вокруг силуэта и светящийся контур по его верхнему краю." = "Night, a warm source is hidden behind the ball. Draw a halo around the silhouette and a glowing outline along its top edge."
"Создайте новый слой для свечения." = "Create a new layer for the glow."
"Свет удобно держать отдельно, чтобы потом подобрать его силу непрозрачностью слоя." = "It is handy to keep the light separate, so its strength can be adjusted later with the layer opacity."
"Большой мягкой кистью тёплого цвета нарисуйте ореол вокруг шара, ярче всего сверху." = "With a large soft brush in a warm colour, paint a halo around the ball, brightest at the top."
"Размер 200 и больше, жёсткость 0%, непрозрачность 20–30%. Несколько проходов вокруг силуэта." = "Size 200 or more, hardness 0%, opacity 20–30%. Several passes around the silhouette."
"Над шаром пока нет свечения: воздух там такой же тёмный, как в углу." = "There is no glow above the ball yet: the air there is as dark as in the corner."
"Тонкой кистью проведите светлый контур по верхнему краю силуэта." = "With a thin brush, draw a light outline along the top edge of the silhouette."
"Размер 10–20, светлый тёплый цвет. Линия идёт внутри силуэта, у самого края." = "Size 10–20, a light warm colour. The line runs inside the silhouette, right at the edge."
"Верхний край силуэта ещё тёмный: нужен светящийся контур." = "The top edge of the silhouette is still dark: it needs a glowing outline."
"Середина шара посветлела. В контровом свете она остаётся тёмным силуэтом." = "The middle of the ball got lighter. In backlight it stays a dark silhouette."
"Источник света прямо за шаром. Как выглядит шар?" = "The light source is right behind the ball. How does the ball look?"
"Ярко освещённым спереди" = "Brightly lit from the front"
"Тёмным силуэтом со светлым контуром" = "A dark silhouette with a light outline"
"Невидимым" = "Invisible"
"Почему вокруг предмета в контровом свете виден ореол?" = "Why is there a halo around an object in backlight?"
"Свет рассеивается в воздухе: дымка, пыль, туман" = "Light scatters in the air: haze, dust, mist"
"Это ошибка художника" = "It is the artist's mistake"
"Так светится сам предмет" = "The object itself glows like that"
"Источник за шаром: мы видим силуэт и светящийся контур" = "The source is behind the ball: we see a silhouette and a glowing outline"
"Новый слой «Свечение»" = "A new “Glow” layer"
"Большая мягкая кисть, тёплый свет, непрозрачность 30%: ореол вокруг шара" = "A large soft brush, warm light, opacity 30%: a halo around the ball"
"Тонкая кисть — контровой свет по верхнему краю силуэта" = "A thin brush — backlight along the top edge of the silhouette"
"Середина силуэта остаётся тёмной — так читается контражур" = "The middle of the silhouette stays dark — that is how contre-jour reads"
