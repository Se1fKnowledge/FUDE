# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Свет на сложной форме: драпировка" = "Light on a complex form: drapery"
"Складки ткани — ряд цилиндров. Тот же свет и тень, повторённые ритмом." = "The folds of cloth are a row of cylinders. The same light and shadow, repeated in rhythm."
"Ткань висит на перекладине, свет слева. Вылепите складки светом и тенью." = "A cloth hangs from a rail, the light is on the left. Model the folds with light and shadow."
"Возьмите мягкую кисть: жёсткость не больше 40%." = "Take a soft brush: hardness no more than 40%."
"Складки ткани мягкие — их тени без резких краёв." = "The folds of cloth are soft — their shadows have no hard edges."
"Покройте ткань общим средним тоном." = "Cover the cloth with an overall mid tone."
"Новый слой, прямоугольное выделение по ткани, заливка средним серым." = "A new layer, a rectangular selection over the cloth, a mid-grey fill."
"Ткань покрыта тоном меньше чем наполовину." = "Less than half of the cloth is covered with tone."
"Затемните глубину левой складки — вдоль левой линии сгиба." = "Darken the depth of the left fold — along the left fold line."
"Самое тёмное — в глубине, где ткань уходит от света." = "The darkest part is in the depth, where the cloth turns away from the light."
"Глубина левой складки пока не темнее её гребня." = "The depth of the left fold is not darker than its ridge yet."
"Так же затемните глубину правой складки." = "Darken the depth of the right fold the same way."
"Повторите ритм: свет на гребне, тень в глубине." = "Repeat the rhythm: light on the ridge, shadow in the depth."
"Глубина правой складки пока не темнее её гребня." = "The depth of the right fold is not darker than its ridge yet."
"Свет слева. Где на вертикальной складке тень?" = "The light is on the left. Where is the shadow on a vertical fold?"
"На левом склоне" = "On the left slope"
"На правом склоне и в глубине" = "On the right slope and in the depth"
"На гребне" = "On the ridge"
"На какую простую форму похожа одна складка?" = "Which simple form does one fold resemble?"
"Куб" = "A cube"
"Цилиндр" = "A cylinder"
"Конус" = "A cone"
"Свет слева. Каждая складка — маленький цилиндр со своим светом и тенью" = "The light is on the left. Each fold is a small cylinder with its own light and shadow"
"Новый слой «Тон» и общий средний тон ткани" = "A new «Tone» layer and the overall mid tone of the cloth"
"Мягкая кисть: в глубине складок тень" = "A soft brush: shadow in the depth of the folds"
"На гребнях — свет" = "Light on the ridges"
"Правая сторона каждой складки отвёрнута от света — она чуть темнее левой" = "The right side of each fold faces away from the light — it is slightly darker than the left"
