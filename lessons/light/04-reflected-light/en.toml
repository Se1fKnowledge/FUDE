# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Рефлекс и отражённый свет" = "Reflected light"
"Свет, отражённый от пола, подсвечивает теневую сторону — но всегда слабее прямого." = "Light bounced off the floor lights up the shadow side — but always weaker than direct light."
"Шар стоит на тёплом полу. Добавьте рефлекс — отражённый свет у нижнего правого края в тени." = "The ball stands on a warm floor. Add reflected light at the bottom right edge in the shadow."
"Создайте слой «Рефлекс»." = "Create a “Reflected light” layer."
"Ctrl+Shift+N и двойной щелчок по имени слоя." = "Ctrl+Shift+N and a double click on the layer name."
"Нет слоя с именем «Рефлекс»." = "There is no layer named “Reflected light”."
"Возьмите мягкую кисть: жёсткость не больше 40%, непрозрачность не больше 50%." = "Take a soft brush: hardness no more than 40%, opacity no more than 50%."
"Рефлекс наращивается очень мягко, иначе он «выскочит» из тени." = "Reflected light is built up very gently, otherwise it \"jumps out\" of the shadow."
"Проведите по краю шара внутри тени, справа снизу, тоном чуть светлее тени, но темнее света." = "Paint along the edge of the ball inside the shadow, at the bottom right, with a tone slightly lighter than the shadow but darker than the light."
"Дуга вдоль края, но не по самому контуру: рефлекс лежит внутри формы." = "An arc along the edge, but not on the outline itself: reflected light lies inside the form."
"У нижнего правого края шара пока нет рефлекса." = "There is no reflected light at the bottom right edge of the ball yet."
"Рефлекс должен быть заметно светлее самой тёмной части тени." = "Reflected light must be noticeably lighter than the darkest part of the shadow."
"Рефлекс слишком яркий: он должен оставаться частью тени." = "The reflected light is too bright: it must stay part of the shadow."
"Рефлекс на теневой стороне может быть светлее освещённой стороны?" = "Can reflected light on the shadow side be lighter than the lit side?"
"Да, если пол белый" = "Yes, if the floor is white"
"Нет, рефлекс всегда темнее света" = "No, reflected light is always darker than the light"
"Да, в солнечный день" = "Yes, on a sunny day"
"Какого цвета рефлекс от тёплого оранжевого пола?" = "What colour is the reflected light from a warm orange floor?"
"Холодный голубой" = "A cool blue"
"Тёплый, с оттенком пола" = "Warm, with a tint of the floor"
"Чисто серый" = "Pure grey"
"Тёплый пол отражает свет обратно на теневую сторону шара" = "The warm floor bounces light back onto the ball's shadow side"
"Новый слой «Рефлекс»" = "A new “Reflected light” layer"
"Мягкая кисть, непрозрачность 25%, тон чуть светлее тени" = "A soft brush, opacity 25%, a tone slightly lighter than the shadow"
"Ведём по краю шара внутри тени, снизу справа" = "Painting along the edge of the ball inside the shadow, at the bottom right"
"Рефлекс всегда темнее освещённой стороны — не перестарайтесь" = "Reflected light is always darker than the lit side — do not overdo it"
