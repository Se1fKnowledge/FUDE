# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Падающая тень от сферы" = "A sphere's cast shadow"
"Тень на полу: где она начинается, куда ложится и почему темнее у основания." = "The shadow on the floor: where it starts, where it falls and why it is darkest at the base."
"Шар уже вылеплен светом. Нарисуйте его падающую тень на полу." = "The ball is already modelled with light. Draw its cast shadow on the floor."
"Создайте слой «Тень»." = "Create a “Shadow” layer."
"Ctrl+Shift+N и двойной щелчок по имени, чтобы переименовать." = "Ctrl+Shift+N and a double click on the name to rename it."
"Нет слоя с именем «Тень»." = "There is no layer named “Shadow”."
"Мягкой тёмной кистью проложите тень на полу вправо от шара." = "With a soft dark brush, lay the shadow on the floor to the right of the ball."
"Тень — сплющенный овал, который начинается в точке касания и уходит от света." = "The shadow is a flattened oval that starts at the point of contact and goes away from the light."
"Тени на полу справа от шара пока мало." = "There is still too little shadow on the floor to the right of the ball."
"Тень легла и слева от шара, со стороны света. Сотрите её там." = "The shadow also landed to the left of the ball, on the side of the light. Erase it there."
"Сделайте тень темнее всего у самого шара и светлее к дальнему краю." = "Make the shadow darkest right at the ball and lighter towards the far edge."
"Маленькой мягкой кистью добавьте тёмный тон у точки касания." = "With a small soft brush, add a dark tone at the point of contact."
"У точки касания тень должна быть темнее, чем у дальнего края." = "At the point of contact the shadow must be darker than at the far edge."
"Где падающая тень темнее всего?" = "Where is the cast shadow darkest?"
"У дальнего края" = "At the far edge"
"У точки касания предмета и пола" = "At the point where the object touches the floor"
"Везде одинаково" = "The same everywhere"
"Под самым шаром свет не попадает на пол ни с какой стороны." = "Right under the ball, light reaches the floor from no side."
"Солнце слева сверху. Куда ложится тень шара?" = "The sun is at the top left. Where does the ball's shadow fall?"
"Влево" = "To the left"
"Вправо" = "To the right"
"Прямо вверх" = "Straight up"
"Тень ложится в сторону от света: вправо и назад" = "The shadow falls away from the light: to the right and back"
"Новый слой «Тень» — под шаром удобно править отдельно" = "A new “Shadow” layer — easy to adjust separately under the ball"
"Мягкая кисть, тёмный тон, непрозрачность 40%" = "A soft brush, a dark tone, opacity 40%"
"Тень начинается в точке касания…" = "The shadow starts at the point of contact…"
"…и темнее всего у самого шара: туда свет не попадает совсем" = "…and is darkest right at the ball: no light gets there at all"
