# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Ластик и отмена" = "Eraser and undo"
"Стирать лишнее и не бояться ошибок: история действий помнит всё." = "Erase what you do not need and do not fear mistakes: the history remembers everything."
"На листе с аккуратным кругом посадили кляксу. Сотрите её, не задев круг, а потом проверьте, как работает отмена." = "Someone dropped a blot on a sheet with a neat circle. Erase it without touching the circle, then try how undo works."
"Выберите «Ластик» (E)." = "Pick the «Eraser» (E)."
"Значок ластика на панели инструментов." = "The eraser icon on the toolbar."
"Сотрите кляксу справа. Круг слева должен остаться." = "Erase the blot on the right. The circle on the left must stay."
"Сделайте ластик крупным клавишей ] и проведите зигзагом." = "Make the eraser large with the ] key and sweep in a zigzag."
"На месте кляксы ещё осталась тушь." = "Some ink is still left where the blot was."
"Круг слева задет. Отмените лишнее: Ctrl+Z." = "The circle on the left got hit. Undo the extra: Ctrl+Z."
"Возьмите кисть, проведите случайный штрих и отмените его: Ctrl+Z." = "Take the brush, make a random stroke and undo it: Ctrl+Z."
"Редактирование › Отменить, или Ctrl+Z. Отменённое можно вернуть: Ctrl+Shift+Z." = "Edit › Undo, or Ctrl+Z. What you undid can come back: Ctrl+Shift+Z."
"Сначала проведите штрих, а затем отмените его: Ctrl+Z." = "First make a stroke, then undo it: Ctrl+Z."
"Что делает Ctrl+Z?" = "What does Ctrl+Z do?"
"Сохраняет файл" = "Saves the file"
"Отменяет последнее действие" = "Undoes the last action"
"Стирает весь холст" = "Erases the whole canvas"
"Чем ластик похож на кисть?" = "How is the eraser like a brush?"
"У него тоже есть размер и жёсткость" = "It also has a size and hardness"
"Ничем" = "It is not"
"Он рисует фоновым цветом на любом слое" = "It paints with the background colour on any layer"
"Ластик — это кисть наоборот: те же размер, жёсткость и непрозрачность." = "The eraser is a brush in reverse: the same size, hardness and opacity."
"Инструмент «Ластик» — клавиша E" = "The «Eraser» tool — key E"
"Крупный ластик: размер 90" = "A large eraser: size 90"
"Стираем кляксу зигзагом" = "Erasing the blot in a zigzag"
"Случайный штрих кистью…" = "A random brush stroke…"
"…и отмена: Ctrl+Z. Ctrl+Shift+Z возвращает отменённое" = "…and undo: Ctrl+Z. Ctrl+Shift+Z brings it back"
