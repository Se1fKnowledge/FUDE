# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Выделение и заливка" = "Selection and fill"
"Ограничить область работы и залить её цветом одним действием." = "Limit the working area and fill it with colour in one action."
"Соберите простую композицию: прямоугольник индиго слева и круг киновари справа." = "Build a simple composition: an indigo rectangle on the left and a vermilion circle on the right."
"Выберите «Прямоугольную область» (M)." = "Pick the “Rectangular Marquee” (M)."
"Значок пунктирного прямоугольника вверху панели инструментов." = "The dashed rectangle icon at the top of the toolbar."
"Выделите высокий прямоугольник в левой части холста." = "Select a tall rectangle in the left part of the canvas."
"Нажмите и протяните мышь от левого верхнего угла к правому нижнему." = "Press and drag the mouse from the top left corner to the bottom right."
"Залейте выделение цветом индиго (#2F5D8C)." = "Fill the selection with indigo (#2F5D8C)."
"Редактирование › Выполнить заливку (Shift+F5), «Цвет», код 2F5D8C." = "Edit › Fill (Shift+F5), “Color”, code 2F5D8C."
"Прямоугольник слева пока не индиго." = "The rectangle on the left is not indigo yet."
"Выберите «Овальную область»." = "Pick the “Elliptical Marquee”."
"Долгий щелчок по значку прямоугольной области откроет соседние инструменты. Или Shift+M." = "A long click on the rectangular marquee icon opens the tools next to it. Or Shift+M."
"Выделите круг справа (держите Shift) и залейте его киноварью (#BC3823)." = "Select a circle on the right (hold Shift) and fill it with vermilion (#BC3823)."
"Shift во время выделения делает ровный круг." = "Shift while selecting makes an even circle."
"Круг справа пока не киноварный." = "The circle on the right is not vermilion yet."
"Снимите выделение: Ctrl+D." = "Deselect: Ctrl+D."
"Выделение › Отменить выделение." = "Select › Deselect."
"Что происходит с мазком кисти, если есть выделение?" = "What happens to a brush stroke when there is a selection?"
"Он ложится только внутри выделения" = "It only lands inside the selection"
"Он ложится только снаружи" = "It only lands outside"
"Выделение ни на что не влияет" = "The selection affects nothing"
"Как снять выделение?" = "How do you deselect?"
"Ctrl+A выделяет всё, а Delete стирает содержимое выделения." = "Ctrl+A selects everything, and Delete erases what is inside the selection."
"«Прямоугольная область» — клавиша M" = "The “Rectangular Marquee” — key M"
"Тянем рамку: бегущие муравьи показывают границу" = "Dragging a frame: the marching ants show the border"
"Редактирование › Выполнить заливку: индиго #2F5D8C" = "Edit › Fill: indigo #2F5D8C"
"«Овальная область»: Shift+M или долгий щелчок по значку" = "The “Elliptical Marquee”: Shift+M or a long click on the icon"
"Shift при выделении делает круг" = "Shift while selecting makes a circle"
"Заливка киноварью #BC3823" = "Filling with vermilion #BC3823"
"Ctrl+D — снять выделение" = "Ctrl+D — deselect"
