# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Слои" = "Layers"
"Прозрачные листы друг над другом: рисуйте части картины отдельно." = "Transparent sheets on top of each other: draw parts of the picture separately."
"Нарисуйте солнце над пейзажем на отдельном слое, чтобы пейзаж остался нетронутым." = "Draw a sun above the landscape on a separate layer so the landscape stays untouched."
"Создайте новый слой." = "Create a new layer."
"Кнопка «+» внизу панели «Слои» или Ctrl+Shift+N." = "The «+» button at the bottom of the «Layers» panel, or Ctrl+Shift+N."
"Назовите слой «Солнце»." = "Name the layer «Sun»."
"Дважды щёлкните по имени слоя в панели «Слои» и введите новое." = "Double-click the layer name in the «Layers» panel and type a new one."
"Нет слоя с именем «Солнце»." = "There is no layer named «Sun»."
"На слое «Солнце» нарисуйте круглое солнце в правой части неба." = "On the «Sun» layer, draw a round sun in the right part of the sky."
"Проверьте, что в панели «Слои» выделен слой «Солнце». Подойдёт оранжевый цвет." = "Make sure the «Sun» layer is selected in the «Layers» panel. Orange will do."
"Солнце пока маленькое или не на месте: закрасьте круг в правой части неба." = "The sun is still small or in the wrong place: paint a circle in the right part of the sky."
"Скройте фоновый слой, чтобы увидеть солнце отдельно." = "Hide the background layer to see the sun on its own."
"Щёлкните по значку глаза слева от нижнего слоя." = "Click the eye icon to the left of the bottom layer."
"Все слои видимы. Выключите глаз у фонового слоя." = "All layers are visible. Turn off the eye of the background layer."
"Слой «Солнце» должен остаться видимым." = "The «Sun» layer must stay visible."
"Что видно сквозь пустые места слоя?" = "What shows through the empty parts of a layer?"
"Белый цвет" = "White"
"Слои под ним" = "The layers below it"
"Ничего" = "Nothing"
"Как спрятать слой, не удаляя его?" = "How do you hide a layer without deleting it?"
"Стереть ластиком" = "Erase it"
"Выключить глаз слева от слоя" = "Turn off the eye to the left of the layer"
"Сделать его меньше" = "Make it smaller"
"Новый слой: кнопка внизу панели «Слои» или Ctrl+Shift+N" = "A new layer: the button at the bottom of the «Layers» panel, or Ctrl+Shift+N"
"Двойной щелчок по имени слоя — переименовать. Назовём его «Солнце»" = "Double-click the layer name to rename it. Let us call it «Sun»"
"Рисуем солнце на своём слое: пейзаж под ним не задет" = "Drawing the sun on its own layer: the landscape below is untouched"
"Глаз слева от фона прячет его: солнце видно отдельно, а пейзаж цел" = "The eye left of the background hides it: the sun shows on its own, and the landscape is intact"
