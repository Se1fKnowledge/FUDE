# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Непрозрачность и видимость слоя" = "Layer opacity and visibility"
"Сделать слой полупрозрачным, чтобы видеть нижние, и прятать слои без удаления." = "Make a layer translucent to see the ones below, and hide layers without deleting them."
"Проведите широкий мазок индиго поверх чёрного камня и сделайте его полупрозрачным, чтобы камень проступал сквозь цвет." = "Make a wide indigo stroke over the black stone and make it translucent so the stone shows through the colour."
"Создайте новый слой для мазка." = "Create a new layer for the stroke."
"Ctrl+Shift+N или «+» внизу панели «Слои»." = "Ctrl+Shift+N or “+” at the bottom of the “Layers” panel."
"Широкой кистью проведите полосу индиго через весь холст поверх камня." = "With a wide brush, paint an indigo band across the whole canvas over the stone."
"Размер кисти около 120 пикселей. Shift при щелчке в конце рисует прямую линию." = "A brush size of about 120 pixels. Shift with a click at the end draws a straight line."
"Полоса пока узкая или короткая: проведите её через весь холст." = "The band is still narrow or short: paint it across the whole canvas."
"Уменьшите непрозрачность слоя до 30–60%: камень должен проступить сквозь полосу." = "Lower the layer opacity to 30–60%: the stone should show through the band."
"Поле «Непрозрачность» вверху панели «Слои». При выбранном «Перемещении» цифры 3, 4, 5 задают 30%, 40%, 50%." = "The “Opacity” field at the top of the “Layers” panel. With “Move” selected, the keys 3, 4, 5 set 30%, 40%, 50%."
"Ни у одного слоя нет непрозрачности 30–60%." = "No layer has an opacity of 30–60%."
"Камень не проступает сквозь полосу. Непрозрачность нужно уменьшить именно у слоя с полосой." = "The stone does not show through the band. Lower the opacity of the layer with the band."
"Выключите видимость слоя с полосой." = "Turn off the visibility of the layer with the band."
"Значок глаза слева от слоя." = "The eye icon to the left of the layer."
"Все слои видимы. Выключите глаз у слоя с полосой." = "All layers are visible. Turn off the eye of the layer with the band."
"Чем непрозрачность слоя отличается от непрозрачности кисти?" = "How does layer opacity differ from brush opacity?"
"Ничем" = "It does not"
"Она меняет весь слой разом, и её можно поправить потом" = "It changes the whole layer at once, and you can adjust it later"
"Она работает только на фоне" = "It only works on the background"
"Слой с непрозрачностью 0% —" = "A layer with 0% opacity is"
"удалён" = "deleted"
"полностью невидим, но цел" = "completely invisible, but intact"
"залит белым" = "filled with white"
"Новый слой для мазка" = "A new layer for the stroke"
"Широкая кисть индиго поверх камня" = "A wide indigo brush over the stone"
"Непрозрачность слоя 45%: камень проступает сквозь мазок" = "Layer opacity 45%: the stone shows through the stroke"
"Глаз выключает слой целиком, не стирая его" = "The eye turns the whole layer off without erasing it"
