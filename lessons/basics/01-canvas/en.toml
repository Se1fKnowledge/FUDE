# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Холст и масштаб" = "Canvas and zoom"
"Приближать, отдалять и двигать холст, не меняя рисунок." = "Zoom in, zoom out and move the canvas without changing the drawing."
"В правом нижнем углу картины спрятана маленькая печать. Найдите её с лупой, рассмотрите и верните холст целиком." = "A small seal is hidden in the bottom right corner of the picture. Find it with the magnifier, take a look and show the whole canvas again."
"Выберите инструмент «Масштаб» (Z)." = "Pick the «Zoom» tool (Z)."
"Значок лупы на панели инструментов слева, внизу." = "The magnifier icon on the toolbar on the left, near the bottom."
"Приблизьте печать в правом нижнем углу до 200% или больше." = "Zoom in on the seal in the bottom right corner to 200% or more."
"Щёлкните по печати несколько раз. Масштаб виден в строке состояния внизу." = "Click the seal a few times. The zoom shows in the status bar at the bottom."
"Возьмите «Руку» (H) и подвигайте приближенный холст." = "Take the «Hand» (H) and move the zoomed-in canvas around."
"Пока держите пробел, любой инструмент работает как «Рука»." = "While you hold Space, any tool works as the «Hand»."
"Покажите холст целиком: Ctrl+0." = "Show the whole canvas: Ctrl+0."
"Просмотр › Показать во весь экран, или Ctrl+0." = "View › Fit on Screen, or Ctrl+0."
"Холст ещё приближен. Нажмите Ctrl+0, чтобы увидеть его целиком." = "The canvas is still zoomed in. Press Ctrl+0 to see all of it."
"Что меняет масштаб 200%?" = "What does 200% zoom change?"
"Размер картинки в пикселях" = "The picture size in pixels"
"Только то, насколько крупно вы её видите" = "Only how large you see it"
"Качество рисунка" = "The quality of the drawing"
"Масштаб — это лупа. Сам документ остаётся того же размера." = "Zoom is a magnifier. The document itself stays the same size."
"Как быстро показать холст целиком?" = "How do you quickly show the whole canvas?"
"Инструмент «Масштаб» — лупа на панели инструментов, клавиша Z" = "The «Zoom» tool — the magnifier on the toolbar, key Z"
"Щелчок приближает, Alt+щелчок отдаляет. В углу — печать" = "A click zooms in, Alt+click zooms out. The seal is in the corner"
"Ещё ближе: 400%" = "Even closer: 400%"
"«Рука» (H или зажатый пробел) двигает приближенный холст" = "The «Hand» (H, or hold Space) moves the zoomed-in canvas"
"Ctrl+0 — показать холст целиком" = "Ctrl+0 — show the whole canvas"
