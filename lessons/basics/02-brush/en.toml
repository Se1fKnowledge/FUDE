# English for this lesson: each original text and its translation (docs/lesson-format.md, «Языки»).

[text]
"Кисть: размер, жёсткость, цвет" = "Brush: size, hardness, colour"
"Три главных параметра кисти и как они меняют мазок." = "The three main brush settings and how they change the stroke."
"Проведите три мягких мазка тушью в верхней половине листа и один мазок киноварью внизу." = "Make three soft ink strokes in the top half of the sheet and one vermilion stroke at the bottom."
"Выберите «Кисть» (B)." = "Pick the «Brush» (B)."
"Значок кисти на панели инструментов." = "The brush icon on the toolbar."
"Сделайте размер кисти от 30 до 80 пикселей." = "Set the brush size to 30–80 pixels."
"Клавиши [ и ] уменьшают и увеличивают кисть. Размер виден на панели параметров сверху." = "The [ and ] keys make the brush smaller and larger. The size shows in the options bar at the top."
"Сделайте кисть мягкой: жёсткость не больше 20%." = "Make the brush soft: hardness no more than 20%."
"Shift+[ снижает жёсткость. Можно задать её в окне «Параметры кисти»." = "Shift+[ lowers the hardness. You can also set it in the «Brush Settings» window."
"Проведите три горизонтальных мазка в верхней половине листа." = "Make three horizontal strokes in the top half of the sheet."
"Ведите мышь ровно и не спеша, от левого края к правому." = "Move the mouse evenly and unhurriedly, from the left edge to the right."
"Мазков пока мало. Проведите три длинных мазка в верхней половине." = "Not enough strokes yet. Make three long strokes in the top half."
"Смените основной цвет на киноварь (#BC3823) и проведите мазок внизу." = "Change the foreground colour to vermilion (#BC3823) and make a stroke at the bottom."
"Щёлкните по верхнему квадрату цвета на панели инструментов и введите BC3823." = "Click the top colour square on the toolbar and enter BC3823."
"Какая кисть даёт размытый, тающий край?" = "Which brush gives a soft, melting edge?"
"Жёсткость 100%" = "Hardness 100%"
"Жёсткость 0%" = "Hardness 0%"
"Размер 1 пиксель" = "Size 1 pixel"
"Какие клавиши меняют размер кисти на ходу?" = "Which keys change the brush size on the fly?"
"Ctrl+Z и Ctrl+Y" = "Ctrl+Z and Ctrl+Y"
"+ и −" = "+ and −"
"[ и ]" = "[ and ]"
"Инструмент «Кисть» — клавиша B" = "The «Brush» tool — key B"
"Размер 50 пикселей: клавиши [ и ] меняют его на ходу" = "Size 50 pixels: the [ and ] keys change it on the fly"
"Жёсткая кисть: чёткий край" = "A hard brush: a crisp edge"
"Жёсткость 0%: край тает, как тушь на влажной бумаге" = "Hardness 0%: the edge melts like ink on damp paper"
"Ещё один мягкий мазок" = "One more soft stroke"
"Основной цвет — киноварь #BC3823" = "Foreground colour — vermilion #BC3823"
"Мазок новым цветом" = "A stroke in the new colour"
